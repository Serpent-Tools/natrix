[workspace]
resolver = "3"
members = [
    "crates/natrix_shared",
    "crates/natrix_macros",
    "crates/natrix",
    "crates/natrix-cli",
    "ci/integration_tests",
    "ci/integration_tests_dependency",
]
exclude = [
    "ci/benchmark", 
]

[workspace.dependencies]
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
missing_docs = "warn"
unfulfilled_lint_expectations = "warn"
unsafe_code = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
pedantic = {level = "warn", priority = 1}
allow_attributes = "deny"
allow_attributes_without_reason = "deny"


# robust code
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
exit = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "warn"
panic = { level = "deny", priority = 0 }

type_complexity = "allow" # TODO: didnt seem too complex

# niche stuff
assertions_on_result_states = "warn"
cargo_common_metadata = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
empty_drop = "deny"
empty_enum_variants_with_brackets = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
infinite_loop = "warn"
lossy_float_literal = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
needless_raw_strings = "warn"
negative_feature_names = "warn"
partial_pub_fields = "warn"
redundant_pub_crate = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
redundant_test_prefix = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
self_named_module_files = "deny"
shadow_unrelated = "warn"
single_char_lifetime_names = "warn"
str_to_string = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "deny"
try_err = "warn"
unneeded_field_pattern = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "deny"
min_ident_chars = "warn"

